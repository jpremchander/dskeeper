name: Cyber News Update

on:
  schedule:
        # Runs every 6 hours (UTC-based). Local timezone: Waterloo, ON (Eastern Time)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch cybersecurity news and update README
        run: |
          python update_quote.py

      - name: Commit and Push
        run: |
          git config --global user.name "Cyber News Bot"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          
          # Check if there are changes before committing to avoid empty commit errors
          git add README.md
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Daily Update: Latest cybersecurity news 🛡️"
            git push
          fi
